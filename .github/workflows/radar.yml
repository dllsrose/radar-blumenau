name: Validar e publicar base coletada localmente
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_radar.py test_attendance.py test_attendance_collect.py test_build_lite.py
      - run: node test_attendance_ui.cjs
      - run: node test_bairros.cjs
      - run: python verify_site.py
      # Divide a base em arquivos menores para o site abrir rápido (dist/lite não fica no repositório).
      - run: python build_lite.py
      - uses: actions/upload-artifact@v4
        with:
          name: base-validada
          path: |
            dist/data.json
            dist/audit.json
            dist/attendance-audit.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
